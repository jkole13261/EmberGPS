##############################################################################
# EmberGPS — Nginx configuration
#
# Serves:
#   - Static map UI from /usr/share/nginx/html
#   - API reverse proxy to Spring Boot on http://backend:8080
#
# Replace YOUR_DOMAIN with your actual domain name.
# SSL certificates are expected at /etc/nginx/ssl/cert.pem and key.pem.
# Use certbot (Let's Encrypt) to generate them:
#
#   certbot certonly --standalone -d YOUR_DOMAIN
#   cp /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem nginx/ssl/cert.pem
#   cp /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem   nginx/ssl/key.pem
##############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript;

    # ── Upstream: Spring Boot backend ─────────────────────────────────────
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (6 months)
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        # ── Static frontend ──────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ── API proxy to Spring Boot ─────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Limit GPS ingest request body to 64 KB
            client_max_body_size 64k;
        }

        # ── Actuator health (internal monitoring) ────────────────────────
        location /actuator/health {
            proxy_pass http://backend;
            allow 127.0.0.1;
            # Uncomment to restrict to internal network:
            # allow 10.0.0.0/8;
            # deny  all;
        }
    }
}
