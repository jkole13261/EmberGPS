spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:embergps}
    username: ${DB_USER:embergps}
    password: ${DB_PASSWORD:embergps}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native  # needed when behind a reverse proxy

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  # Admin API key — CHANGE THIS in production via environment variable
  admin-api-key: ${ADMIN_API_KEY:change-me-before-deploy}

  # Number of days to retain GPS history (0 = keep forever)
  data-retention-days: ${DATA_RETENTION_DAYS:90}

  # Rate limiting: max GPS ingest requests per minute per device
  rate-limit:
    ingest-per-minute: ${RATE_LIMIT_INGEST_PER_MINUTE:120}

  # CORS — set to your frontend origin in production
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.embergps: INFO
    org.springframework.web: WARN
