version: "3.9"

# Development compose — no TLS, hot-swap-friendly
# Usage: docker compose up -d

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: embergps_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       embergps
      POSTGRES_USER:     embergps
      POSTGRES_PASSWORD: ${DB_PASSWORD:-embergps}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local access only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embergps"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: embergps_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:            postgres
      DB_PORT:            5432
      DB_NAME:            embergps
      DB_USER:            embergps
      DB_PASSWORD:        ${DB_PASSWORD:-embergps}
      ADMIN_API_KEY:      ${ADMIN_API_KEY:-change-me-before-deploy}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      SERVER_PORT:        8080
    ports:
      - "127.0.0.1:8080:8080"   # local access only — Nginx fronts this
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy + static frontend ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: embergps_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # mount Let's Encrypt certs here
      - ./frontend:/usr/share/nginx/html:ro    # static map UI

volumes:
  pgdata:
